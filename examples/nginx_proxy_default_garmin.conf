# Route le serveur MCP Garmin derrière le proxy NGINX de Home Assistant.
# Toute URL de la forme /<jeton d'au moins 32 caractères>/mcp part vers l'add-on Garmin,
# qui vérifie lui-même le jeton. Tout le reste continue vers Home Assistant.
# Ce fichier ne contient aucun secret.
location ~ "^/[A-Za-z0-9_-]{32,}/mcp" {
    # Résolution à la volée : si l'add-on Garmin est arrêté, NGINX démarre quand même.
    resolver 172.30.32.3 valid=30s;
    # Remplacer <hostname-de-l-add-on> par le hostname de l'add-on (ex. 080ebc33-garmin-coach-mcp)
    set $garmin_mcp https://<hostname-de-l-add-on>.local.hass.io:8766;
    proxy_pass $garmin_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}
