name: Garmin Coach MCP
version: "0.5.0"
slug: garmin_coach_mcp
description: "Coach Claude pour un ou plusieurs athlètes (binôme de swimrun) : données Garmin, panneau Coach, envoi des séances sur la montre"
url: https://github.com/INTechLucas/garmin-coach-addon
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Coach
boot: auto
ports:
  8766/tcp: 8766
ports_description:
  8766/tcp: Serveur MCP (HTTPS)
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
options:
  athletes: []
  garmin_api_key: ""
  access_token: ""
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
schema:
  athletes:
    - id: match(^[a-z0-9][a-z0-9-]{0,31}$)
      nom: str
      garmin_api_key: "password?"
      utilisateurs_ha: "str?"
  garmin_api_key: "password?"
  access_token: "password?"
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)
