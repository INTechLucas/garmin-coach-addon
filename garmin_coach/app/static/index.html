<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --ink2: #4a5260; --ink3: #7b8494;
    --line: #e3e6eb; --accent: #0f766e; --accent-soft: #e6f4f2; --warn: #b45309; --warn-soft: #fdf2e3;
    --ok: #15803d; --ok-soft: #e8f5ec; --chip: #eef0f3;
    --course: #0f766e; --natation: #2563eb; --swimrun: #7c3aed; --renfo: #c2410c; --velo: #a16207; --autre: #64748b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f25; --ink: #eef1f5; --ink2: #b8c0cc; --ink3: #8b94a3;
      --line: #2b313a; --accent: #2dd4bf; --accent-soft: #123430; --warn: #fbbf24; --warn-soft: #3a2c10;
      --ok: #4ade80; --ok-soft: #11301c; --chip: #262b33;
      --course: #2dd4bf; --natation: #60a5fa; --swimrun: #a78bfa; --renfo: #fb923c; --velo: #facc15; --autre: #94a3b8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--ink2); font: inherit; font-weight: 600;
    padding: 8px 6px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .weeknav button { border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 40px; height: 40px;
    border-radius: 10px; font-size: 20px; cursor: pointer; }
  .weeknav button:disabled { opacity: .35; cursor: default; }
  .weeknav .label { text-align: center; }
  .weeknav .label b { display: block; font-size: 16px; }
  .weeknav .label span { color: var(--ink3); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 0 0 10px; font-weight: 700; }
  .empty { color: var(--ink3); font-size: 14px; }
  .resume { font-weight: 600; margin: 0 0 8px; }
  .md { color: var(--ink2); overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3 { color: var(--ink); font-size: 16px; margin: 14px 0 6px; text-transform: none; letter-spacing: 0; }
  .md p { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; margin: 6px 0; }
  .md strong { color: var(--ink); }
  .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; display: block; overflow-x: auto; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 5px 8px 5px 0; text-align: left; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--chip); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink3); font-size: 12px; }
  .sports { display: flex; flex-direction: column; gap: 6px; }
  .sport { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .sport .n { flex: 1; font-weight: 600; }
  .sport .v { color: var(--ink2); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin: 2px 0 4px 20px; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .forme { display: grid; grid-template-columns: 66px repeat(7, 1fr); gap: 3px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .forme .h { color: var(--ink3); text-align: center; font-weight: 600; padding-bottom: 2px; }
  .forme .h.today { color: var(--accent); }
  .forme .r { color: var(--ink3); align-self: center; font-size: 12px; }
  .forme .c { text-align: center; padding: 6px 0; border-radius: 7px; background: var(--chip); color: var(--ink); }
  .forme .c.low { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
  .forme .c.good { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .forme .c.na { background: transparent; color: var(--ink3); }
  .legend { color: var(--ink3); font-size: 12px; margin-top: 8px; }
  .act { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .act:first-of-type { border-top: 0; padding-top: 2px; }
  .act .day { width: 38px; flex: none; text-align: center; color: var(--ink3); font-size: 12px; line-height: 1.2; }
  .act .day b { display: block; color: var(--ink); font-size: 17px; }
  .act .body { flex: 1; min-width: 0; }
  .act .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .act .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .meta { color: var(--ink2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-top: 3px; }
  details.fiche { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  details.fiche summary { list-style: none; cursor: pointer; padding: 12px 16px; }
  details.fiche summary::-webkit-details-marker { display: none; }
  details.fiche summary .t { font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
  details.fiche summary .t small { color: var(--ink3); font-weight: 500; white-space: nowrap; }
  details.fiche summary .r { color: var(--ink2); font-size: 14px; margin-top: 2px; }
  details.fiche .md { padding: 0 16px 14px; border-top: 1px solid var(--line); }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; margin: 16px 2px 8px; }
  .err { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .loading { color: var(--ink3); padding: 30px 0; text-align: center; }
  .updated { color: var(--ink3); font-size: 12px; margin-top: 8px; }
  @media (max-width: 380px) { .forme { grid-template-columns: 54px repeat(7, 1fr); font-size: 11.5px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Coach</h1></header>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="semaine" aria-selected="true">Semaine</button>
    <button role="tab" data-tab="seance" aria-selected="false">Séances</button>
    <button role="tab" data-tab="analyse" aria-selected="false">Analyses</button>
  </div>
  <main id="view"><div class="loading">Chargement…</div></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const JOURS = ["L", "M", "M", "J", "V", "S", "D"];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
let state = { tab: "semaine", week: null };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const d = iso => new Date(iso + "T12:00:00");
const fmtDay = iso => { const x = d(iso); return `${x.getDate()} ${MOIS[x.getMonth()]}`; };
const fmtDur = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; };
const km = v => v ? `${v.toFixed(1).replace(".", ",")} km` : "";
const today = new Date().toISOString().slice(0, 10);

async function api(path) {
  const r = await fetch(path, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

function ficheHTML(f, open = false) {
  const when = f.date ? fmtDay(f.date) : (f.semaine || "");
  return `<details class="fiche"${open ? " open" : ""}>
    <summary><div class="t"><span>${esc(f.titre)}</span><small>${esc(when)}</small></div>
    ${f.resume ? `<div class="r">${esc(f.resume)}</div>` : ""}</summary>
    <div class="md">${f.html}</div></details>`;
}

function weekLabel(w) {
  const s = d(w.debut), e = d(w.fin);
  const sameMonth = s.getMonth() === e.getMonth();
  const range = sameMonth ? `${s.getDate()}–${e.getDate()} ${MOIS[e.getMonth()]}` : `${s.getDate()} ${MOIS[s.getMonth()]} – ${e.getDate()} ${MOIS[e.getMonth()]}`;
  return `<b>${w.courante ? "Cette semaine" : "Semaine " + Number(w.semaine.slice(6))}</b><span>${range} ${e.getFullYear()}</span>`;
}

function formeHTML(jours) {
  const has = jours.some(j => j.vfc || j.sommeil || j.fc_repos || j.bb_max);
  if (!has) return `<p class="empty">Pas encore de données de récupération pour cette semaine.</p>`;
  const zone = z => z ? z.split("-").map(Number) : null;
  const cell = (v, cls = "") => v == null || v === "" ? `<div class="c na">–</div>` : `<div class="c ${cls}">${esc(v)}</div>`;
  let h = `<div class="forme"><div></div>${jours.map((j, i) => `<div class="h${j.date === today ? " today" : ""}">${JOURS[i]}<br>${d(j.date).getDate()}</div>`).join("")}`;
  h += `<div class="r">VFC (ms)</div>` + jours.map(j => {
    const z = zone(j.vfc_zone); let cls = "";
    if (j.vfc && z) cls = j.vfc < z[0] ? "low" : (j.vfc <= z[1] ? "good" : "");
    return cell(j.vfc, cls);
  }).join("");
  h += `<div class="r">Sommeil</div>` + jours.map(j => cell(j.sommeil ? j.sommeil.replace("h", "h") : null,
      j.sommeil_score != null ? (j.sommeil_score < 60 ? "low" : (j.sommeil_score >= 80 ? "good" : "")) : "")).join("");
  h += `<div class="r">FC repos</div>` + jours.map(j => cell(j.fc_repos)).join("");
  h += `<div class="r">Batterie</div>` + jours.map(j => cell(j.bb_max, j.bb_max != null ? (j.bb_max < 40 ? "low" : (j.bb_max >= 75 ? "good" : "")) : "")).join("");
  h += `</div>`;
  const z = jours.map(j => j.vfc_zone).filter(Boolean).pop();
  h += `<div class="legend">${z ? `Zone VFC normale : ${esc(z)} ms. ` : ""}Batterie = Body Battery max du jour. Orange : sous la normale · Vert : bon niveau.</div>`;
  return h;
}

function activitesHTML(acts) {
  if (!acts.length) return `<p class="empty">Aucune activité enregistrée cette semaine.</p>`;
  return acts.map(a => {
    const dt = (a.date_locale || "").slice(0, 10);
    const x = dt ? d(dt) : null;
    const meta = [km(a.distance_km), a.duree, a.allure_100m ? a.allure_100m + " /100 m" : (a.allure_min_km ? a.allure_min_km + " /km" : ""),
                  a.fc_moy ? `FC ${a.fc_moy}` : ""].filter(Boolean).join(" · ");
    const label = { AEROBIC_BASE: "Endurance", TEMPO: "Tempo", LACTATE_THRESHOLD: "Seuil", VO2MAX: "VO2max",
                    ANAEROBIC_CAPACITY: "Anaérobie", SPRINT: "Sprint", RECOVERY: "Récupération" }[a.label_effet];
    return `<div class="act"><div class="day">${x ? JOURS[(x.getDay() + 6) % 7] : ""}<b>${x ? x.getDate() : ""}</b></div>
      <div class="body"><div class="name"><i class="dot" style="background:var(--${a.groupe})"></i><span>${esc(a.nom || a.sport)}</span></div>
      <div class="meta">${esc(meta)}</div>
      ${label ? `<span class="tag">${label}${a.effet_aerobie ? " · " + String(a.effet_aerobie).replace(".", ",") : ""}</span>` : ""}</div></div>`;
  }).join("");
}

async function renderSemaine() {
  const w = await api("api/semaine" + (state.week ? "?w=" + encodeURIComponent(state.week) : ""));
  state.week = w.semaine;
  const t = w.totaux, max = Math.max(1, ...t.par_sport.map(s => s.duree_s));
  let h = `<div class="weeknav"><button id="prev" aria-label="Semaine précédente">‹</button>
    <div class="label">${weekLabel(w)}</div>
    <button id="next" aria-label="Semaine suivante"${w.courante ? " disabled" : ""}>›</button></div>`;
  if (w.erreurs && w.erreurs.length) h += `<div class="err">Certaines données Garmin n'ont pas pu être lues.</div>`;
  h += `<section class="card"><h2>Résumé du coach</h2>${w.fiche
      ? `${w.fiche.resume ? `<p class="resume">${esc(w.fiche.resume)}</p>` : ""}<div class="md">${w.fiche.html}</div>
         <div class="updated">Mis à jour le ${fmtDay(w.fiche.mis_a_jour.slice(0, 10))}</div>`
      : `<p class="empty">Pas encore de résumé pour cette semaine. Il apparaîtra ici dès que ton coach l'aura publié.</p>`}</section>`;
  h += `<section class="card"><h2>Volume</h2><div class="stats">
      <div class="stat"><b>${t.seances}</b><span>séance${t.seances > 1 ? "s" : ""}</span></div>
      <div class="stat"><b>${t.duree_s ? fmtDur(t.duree_s) : "0 min"}</b><span>durée totale</span></div>
      <div class="stat"><b>${t.charge}</b><span>charge Garmin</span></div></div>
      <div class="sports">${t.par_sport.map(s => `<div><div class="sport"><i class="dot" style="background:var(--${groupKey(s.libelle)})"></i>
        <span class="n">${esc(s.libelle)}</span><span class="v">${[s.distance_km >= 0.1 ? km(s.distance_km) : "", fmtDur(s.duree_s)].filter(Boolean).join(" · ")}</span></div>
        <div class="bar"><i style="width:${(100 * s.duree_s / max).toFixed(0)}%;background:var(--${groupKey(s.libelle)})"></i></div></div>`).join("")}</div></section>`;
  h += `<section class="card"><h2>Forme</h2>${formeHTML(w.jours)}</section>`;
  if (w.seances_prevues.length) h += `<div class="section-title">Séances de la semaine</div>` + w.seances_prevues.map(f => ficheHTML(f)).join("");
  h += `<section class="card"><h2>Activités</h2>${activitesHTML(w.activites)}</section>`;
  view.innerHTML = h;
  $("#prev").onclick = () => { state.week = w.precedente; render(); };
  $("#next").onclick = () => { if (!w.courante) { state.week = w.suivante; render(); } };
}
const groupKey = lib => ({ "Course": "course", "Natation": "natation", "Swimrun": "swimrun", "Renfo / CrossFit": "renfo", "Vélo": "velo" }[lib] || "autre");

async function renderFiches(type) {
  const data = await api("api/fiches?type=" + type);
  let fiches = data.fiches;
  let h = "";
  if (type === "analyse") {
    const plans = (await api("api/fiches?type=plan")).fiches;
    if (plans.length) h += `<div class="section-title">Plan d'entraînement</div>` + plans.map((f, i) => ficheHTML(f, false)).join("");
    h += `<div class="section-title">Analyses</div>`;
    h += fiches.length ? fiches.map(f => ficheHTML(f)).join("") : `<div class="card"><p class="empty">Aucune analyse pour l'instant.</p></div>`;
  } else {
    const avenir = fiches.filter(f => (f.date || "") >= today).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const passees = fiches.filter(f => (f.date || "") < today);
    h += `<div class="section-title">À venir</div>` + (avenir.length ? avenir.map((f, i) => ficheHTML(f, i === 0)).join("")
         : `<div class="card"><p class="empty">Aucune séance prévue pour l'instant.</p></div>`);
    if (passees.length) h += `<div class="section-title">Passées</div>` + passees.map(f => ficheHTML(f)).join("");
  }
  view.innerHTML = h;
}

async function render() {
  view.innerHTML = `<div class="loading">Chargement…</div>`;
  try {
    if (state.tab === "semaine") await renderSemaine();
    else await renderFiches(state.tab);
  } catch (e) {
    view.innerHTML = `<div class="err">Impossible de charger les données (${esc(e.message)}). Réessaie dans un instant.</div>`;
  }
}
render();
</script>
</body>
</html>
